# CI — lint + tests for Misfire.
#
# Named exactly "CI" so the advisory `misfire.yml` workflow (which watches
# `workflows: ["CI"]` via workflow_run) has a real workflow to react to.
#
# Runs with NO API keys: the unit tests are fully offline (the model is scripted
# and the GitHub client is faked — see misfire.testkit).
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Exercise the full declared support range (requires-python >=3.10).
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package + tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          # openai is needed to collect test_openai_loop.py (the OpenAI provider).
          pip install ruff pytest openai
      - name: Ruff
        run: ruff check .
      - name: Unit tests
        run: pytest -q

  # Stable required-status-check gate: green only when every matrix leg passed.
  # Keeps the branch-protection context name "Ruff + pytest" independent of the
  # matrix (whose per-version contexts are "test (pyX.Y)").
  gate:
    name: Ruff + pytest
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require all Python versions to pass
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "One or more Python versions failed: ${{ needs.test.result }}"
            exit 1
          fi
          echo "All Python versions passed."
