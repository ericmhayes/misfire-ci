name: DCO

# Verify every commit in a PR carries a `Signed-off-by` line — the Developer
# Certificate of Origin (see the DCO file). Keeps contribution provenance clean
# without a signing ceremony: `git commit -s` is all a contributor does.
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  dco:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check Signed-off-by on all commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          # Non-merge commits only (merge commits aren't authored content).
          for sha in $(git rev-list --no-merges "${BASE_SHA}..${HEAD_SHA}"); do
            if ! git show -s --format=%B "$sha" | grep -qiE '^Signed-off-by: .+ <.+@.+>'; then
              echo "::error::Commit $sha is missing a 'Signed-off-by' line (DCO)."
              git show -s --format='  %h %s' "$sha"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo ""
            echo "This project uses the Developer Certificate of Origin (DCO)."
            echo "Sign off your commits and re-push:"
            echo "    git commit --amend -s                 # last commit"
            echo "    git rebase --signoff ${BASE_SHA}       # all commits in the PR"
            echo "See CONTRIBUTING.md and the DCO file."
            exit 1
          fi
          echo "All commits are signed off. ✅"
